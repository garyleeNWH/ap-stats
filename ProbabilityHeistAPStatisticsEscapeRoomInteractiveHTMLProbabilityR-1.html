<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probability Heist — AP Statistics Escape Room</title>
<style>
:root{--navy:#0C2340;--navy2:#07172b;--gold:#FFD600;--white:#fff;--ink:#12233a;--green:#16a34a;--red:#dc2626;--muted:#d7e0ec}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--navy);color:var(--white)}body{overflow-x:hidden}.app-shell{min-height:100vh;background:radial-gradient(circle at 50% -10%,#173e6b 0,#0C2340 48%,#07172b 100%)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.screen{min-height:100vh;padding:24px}.hidden{display:none!important}.brand{color:var(--gold);font-weight:900;letter-spacing:.08em;text-transform:uppercase}.topbar{max-width:1180px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.timer{font-variant-numeric:tabular-nums;font-size:clamp(1.4rem,4vw,2.3rem);font-weight:900;color:var(--gold);border:2px solid var(--gold);border-radius:12px;padding:8px 16px;min-width:125px;text-align:center;box-shadow:0 0 18px #ffd60033}.timer.urgent{color:#fff;border-color:#ff4b4b;background:#8b1111;animation:pulse .85s infinite}.progress{max-width:1180px;margin:0 auto 20px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.progress-item{border:1px solid #ffffff44;border-radius:10px;padding:8px;text-align:center;background:#ffffff0d;color:#b7c5d8;font-size:.8rem}.progress-item.current{border-color:var(--gold);color:var(--gold);box-shadow:0 0 16px #ffd60033}.progress-item.cleared{color:#75e19b;border-color:#75e19b}.panel{max-width:1180px;margin:0 auto;background:#ffffff;color:var(--ink);border-radius:22px;box-shadow:0 20px 70px #0007;padding:clamp(20px,4vw,44px)}.start-panel{text-align:center;max-width:900px;margin:8vh auto}.vault-icon{font-size:5rem;filter:drop-shadow(0 0 15px #ffd60066)}h1{font-size:clamp(2.4rem,7vw,5.5rem);line-height:1;margin:12px 0;color:var(--gold);letter-spacing:-.04em}h2{font-size:clamp(1.7rem,4vw,2.8rem);margin:0 0 8px;color:var(--navy)}h3{color:var(--navy);margin-top:0}.subtitle{font-size:clamp(1.1rem,3vw,1.7rem);font-weight:800;color:var(--navy)}.flavor{font-size:1.08rem;line-height:1.7}.gold-btn{border:0;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:950;padding:15px 25px;box-shadow:0 6px 0 #b39a00,0 12px 28px #0003;transition:.15s transform,.15s box-shadow}.gold-btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #b39a00,0 16px 30px #0004}.gold-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b39a00}.small-btn{padding:9px 13px;border-radius:8px;background:var(--navy);color:#fff;border:1px solid var(--navy)}.room-title{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}.room-title p{max-width:760px;line-height:1.6}.scenario{background:#eef3f8;border-left:6px solid var(--gold);padding:18px;border-radius:8px;line-height:1.55;margin:20px 0}.data-table{border-collapse:collapse;width:100%;margin:14px 0;overflow:hidden;border-radius:8px}.data-table th,.data-table td{border:1px solid #9aa9ba;padding:9px;text-align:center}.data-table th{background:var(--navy);color:#fff}.problem-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.problem{border:2px solid #dbe3ec;border-radius:14px;padding:20px;position:relative}.problem::before{content:"PROBLEM";position:absolute;top:-12px;left:14px;background:var(--gold);color:var(--navy);padding:3px 8px;border-radius:5px;font-size:.7rem;font-weight:900}.problem p{line-height:1.55}.answer-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.answer-input{width:170px;padding:11px;border:2px solid #a8b5c4;border-radius:8px;color:var(--ink);font-variant-numeric:tabular-nums}.answer-input::-webkit-outer-spin-button,.answer-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.feedback{min-height:26px;font-weight:800;margin-top:10px}.correct{color:var(--green)}.incorrect{color:var(--red)}.solution{margin-top:12px;padding:14px;background:#fff8cc;border:1px solid #e8ce35;border-radius:8px;line-height:1.6}.solution-toggle{background:none;border:0;color:#765f00;text-decoration:underline;font-weight:800;padding:5px 0}.lock-zone{margin-top:30px;border-top:2px dashed #b8c4d0;padding-top:24px;text-align:center}.lock-zone h3{color:var(--navy)}.dial{width:160px;height:190px;margin:12px auto;position:relative;background:linear-gradient(90deg,#182f4d,#091b31 50%,#182f4d);border:6px solid var(--gold);border-radius:24px;box-shadow:inset 0 0 20px #000,0 10px 25px #0005;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px}.dial-window{height:80px;width:95px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:4rem;font-weight:950;line-height:1;box-shadow:inset 0 0 10px #0005}.dial-arrow{border:0;background:transparent;color:var(--gold);font-size:1.6rem;line-height:1}.dial-status{min-height:30px;font-weight:900}.shake{animation:shake .42s}.flash{animation:flash .8s}.unlocked{color:#926f00;font-size:1.3rem;font-weight:950;animation:pop .8s}.vault-summary{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:28px 0}.mini-dial{width:100px;padding:14px 10px;text-align:center;background:var(--navy);border:3px solid var(--gold);border-radius:14px;color:#fff}.mini-dial strong{display:block;font-size:2.8rem;color:var(--gold)}.final-screen{text-align:center}.vault-stage{height:260px;position:relative;max-width:480px;margin:20px auto;background:#07172b;border:8px solid #6e7d91;border-radius:18px;overflow:hidden;perspective:900px}.vault-interior{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;background:radial-gradient(circle,#ffd60033,#0000 50%)}.vault-door{position:absolute;inset:0;background:linear-gradient(135deg,#738297,#26384f);border:10px solid #aeb9c7;transform-origin:left center;display:grid;place-items:center;font-size:4rem;z-index:2}.vault-door.open{animation:swing 2s forwards}.confetti{position:fixed;inset:0;pointer-events:none;z-index:20}.confetti i{position:absolute;width:10px;height:18px;background:var(--gold);animation:fall 2s ease-out forwards}.overlay{position:fixed;inset:0;background:#07172bd9;display:grid;place-items:center;z-index:30;padding:20px}.overlay-card{background:#fff;color:var(--ink);padding:36px;border-radius:18px;text-align:center;max-width:500px}.footer-note{text-align:center;color:#aec0d7;margin-top:22px;font-size:.85rem}@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 28px #ff3b3b}}@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-7px)}}@keyframes flash{50%{box-shadow:0 0 45px var(--gold);background:#fff2a3}}@keyframes pop{50%{transform:scale(1.15)}}@keyframes swing{to{transform:rotateY(-105deg)}}@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(90vh) rotate(720deg);opacity:0}}
@media(max-width:760px){.screen{padding:14px}.problem-grid{grid-template-columns:1fr}.progress-item{font-size:.68rem;padding:6px 2px}.panel{padding:20px 15px}.topbar{align-items:flex-start}.answer-input{width:100%}.answer-row .small-btn{width:100%}}
</style>
</head>
<body>
<div id="app" class="app-shell"></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const app = document.querySelector('#app');
  const rooms = [
    {name:'THE LOBBY',theme:'You have slipped past the front door. The lobby security panel requires a code.',scenario:'A survey of 240 students asked whether they play a sport and whether they use social media daily.',table:`<table class="data-table"><tr><th></th><th>Uses Social Media</th><th>No Social Media</th><th>Total</th></tr><tr><th>Plays Sport</th><td>72</td><td>48</td><td>120</td></tr><tr><th>No Sport</th><td>36</td><td>84</td><td>120</td></tr><tr><th>Total</th><td>108</td><td>132</td><td>240</td></tr></table>`,problems:[['What is the probability that a randomly selected student plays a sport, given that they do NOT use social media daily? Round to 4 decimal places.','0.3636','P(Sport | No Social Media) = 48/132 = 0.3636'],['What is the probability that a randomly selected student does NOT play a sport, given that they DO use social media daily? Round to 4 decimal places.','0.3333','P(No Sport | Social Media) = 36/108 = 0.3333']],sum:'0.3636 + 0.3333 = 0.6969',digit:6},
    {name:'THE SECURITY OFFICE',theme:'The security office holds the access logs. Crack the filing cabinet.',scenario:'Of 240 students, 130 follow a sports account, 110 follow an arts account, and 55 follow both.',problems:[['What is the probability that a randomly selected student follows BOTH a sports account AND an arts account? Round to 4 decimal places.','0.2292','P(Sports ∩ Arts) = 55/240 = 0.2292'],['Given that a student does NOT follow a sports account, what is the probability they follow an arts account? Round to 4 decimal places.','0.5000','Students not following sports = 240 − 130 = 110. Of those, arts only = 110 − 55 = 55. P(Arts | No Sports) = 55/110 = 0.5000']],sum:'0.2292 + 0.5000 = 0.7292',digit:7},
    {name:'THE SERVER ROOM',theme:'The server room holds the encrypted files. Use probability to break through.',scenario:'55% of students are in the coding club. Students in the coding club have an 80% chance of solving a cybersecurity challenge. Students NOT in the coding club have a 35% chance of solving it.',problems:[['What is the probability that a randomly selected student is in the coding club AND solves the challenge? Round to 4 decimal places.','0.4400','P(Coding ∩ Solves) = 0.55 × 0.80 = 0.4400'],['Given that a student solved the challenge, what is the probability they are in the coding club? Round to 4 decimal places.','0.7364','P(Not Coding ∩ Solves) = 0.45 × 0.35 = 0.1575; P(Solves) = 0.4400 + 0.1575 = 0.5975; P(Coding | Solves) = 0.4400 / 0.5975 = 0.7364']],sum:'0.4400 + 0.7364 = 1.1764',digit:1},
    {name:'THE GUARD STATION',theme:'The guard left snacks behind. Solve the probability puzzle to get past.',scenario:'A bag contains 30 snack bars: 12 granola bars, 8 fruit bars, and 10 pretzel bars. Two snack bars are selected at random WITHOUT replacement.',problems:[['What is the probability that AT LEAST ONE of the two selected snack bars is a granola bar? Round to 4 decimal places.','0.6483','P(no granola) = (18/30) × (17/29) = 306/870 = 0.3517; P(at least one granola) = 1 − 0.3517 = 0.6483'],['Given that the first snack bar selected was NOT a granola bar, what is the probability that the second snack bar selected is a fruit bar? Round to 4 decimal places.','0.2759','If first is not granola (18 non-granola bars), 29 bars remain. Of those, 8 are fruit bars. P(2nd is fruit | 1st not granola) = 8/29 = 0.2759']],sum:'0.6483 + 0.2759 = 0.9242',digit:9},
    {name:'THE VAULT DOOR',theme:'You are at the vault. One final lock stands between you and the prize.',scenario:'In a class of 100 students, 70 joined a study group and 48 passed the quiz. Of those who joined the study group, 42 passed the quiz.',problems:[['What is the probability that a randomly selected student passed the quiz, given that they joined the study group? Round to 4 decimal places.','0.6000','P(Pass | Study Group) = 42/70 = 0.6000'],["Are the events 'joined the study group' and 'passed the quiz' independent? To answer, calculate P(Pass) and P(Pass | Study Group) and compare. Then report P(Joined Study Group | Passed Quiz) rounded to 4 decimal places.",'0.8750','P(Pass) = 48/100 = 0.4800; P(Pass | Study Group) = 42/70 = 0.6000. Since 0.4800 ≠ 0.6000, the events are NOT independent. P(Study Group | Pass) = 42/48 = 0.8750']],sum:'0.6000 + 0.8750 = 1.4750',digit:4}
  ];
  const state={started:false,room:0,remaining:2700,interval:null,answers:rooms.map(()=>[false,false]),entered:rooms.map(()=>null),dial:rooms.map(()=>0),finished:false};
  function renderStart(){app.innerHTML=`<main class="screen"><section class="panel start-panel"><div class="brand">Mr. Lee's AP Stats Lab</div><div class="vault-icon">🔐</div><h1>Probability Heist</h1><div class="subtitle">AP Statistics Escape Room</div><p class="flavor">You and your crew have infiltrated the Statistics Vault. Five rooms stand between you and the combination. Solve the probability puzzles. Crack the code. Get out.</p><button class="gold-btn" data-action="begin">BEGIN THE HEIST</button><p class="footer-note">Five rooms • Conditional probability • Independence • Bayes • Counting</p></section></main>`}
  function progress(){return `<div class="progress">${rooms.map((r,i)=>`<div class="progress-item ${i===state.room?'current ':''}${i<state.room?'cleared':''}">${i<state.room?'✅':i===state.room?'🔓':'🔒'}<br>Room ${i+1}</div>`).join('')}</div>`}
  function renderRoom(){const r=rooms[state.room];app.innerHTML=`<main class="screen"><div class="topbar"><div><div class="brand">Mr. Lee's AP Stats Lab</div><strong>PROBABILITY HEIST</strong></div><div id="timer" class="timer">${formatTime()}</div></div>${progress()}<section class="panel"><div class="room-title"><div><h2>Room ${state.room+1}: ${r.name}</h2><p>${r.theme}</p></div><div class="brand">SECURITY LEVEL ${state.room+1}/5</div></div><div class="scenario"><strong>INTEL:</strong> ${r.scenario}${r.table||''}</div><div class="problem-grid">${r.problems.map((p,i)=>problemHTML(p,i)).join('')}</div><div class="lock-zone ${state.answers[state.room].every(Boolean)?'':'hidden'}"><h3>Both answers accepted. Extract the room digit.</h3><p>Add your two answers together. The tenths digit of the sum is your code digit. Spin the dial to that digit, then confirm.</p><p><strong>${r.sum} → tenths digit: ${r.digit}</strong></p><div class="dial" id="roomDial"><button class="dial-arrow" data-action="dial-up">▲</button><div class="dial-window" id="dialValue">${state.dial[state.room]}</div><button class="dial-arrow" data-action="dial-down">▼</button></div><div id="dialStatus" class="dial-status"></div><button class="gold-btn" data-action="confirm-room">CONFIRM CODE DIGIT</button></div></section></main>`}
  function problemHTML(p,i){return `<article class="problem"><p><strong>${i+1}.</strong> ${p[0]}</p><button class="solution-toggle" data-action="solution" data-index="${i}">Show Worked Solution</button><div class="solution hidden" id="solution-${i}">${p[2]}</div><div class="answer-row"><input class="answer-input" inputmode="decimal" type="number" step="0.0001" data-answer="${i}" aria-label="Answer to problem ${i+1}"><button class="small-btn" data-action="check-answer" data-index="${i}">Check Answer</button></div><div class="feedback" id="feedback-${i}"></div></article>`}
  function formatTime(){const m=Math.floor(state.remaining/60),s=state.remaining%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
  function updateTimer(){const el=document.querySelector('#timer');if(!el)return;el.textContent=formatTime();el.classList.toggle('urgent',state.remaining<300);if(state.remaining<=0&&!document.querySelector('.overlay'))showTimeUp()}
  function showTimeUp(){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="overlay-card"><h2>⏱ Time's Up</h2><p>The clock has reached 0:00, but your crew is not locked out.</p><button class="gold-btn" data-action="continue">KEEP GOING</button></div>`;app.appendChild(o)}
  function startTimer(){state.interval=setInterval(()=>{if(state.remaining>0){state.remaining--;updateTimer()}},1000)}
  function tone(ok){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?740:130;o.type=ok?'sine':'sawtooth';g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(ok?.22:.35));o.start();o.stop(c.currentTime+(ok?.24:.38))}
  function checkAnswer(i){const input=document.querySelector(`[data-answer="${i}"]`),fb=document.querySelector(`#feedback-${i}`);const v=Number(input.value),correct=Number(rooms[state.room].problems[i][1]);if(input.value!==''&&Number.isFinite(v)&&Math.abs(v-correct)<0.00015){state.answers[state.room][i]=true;if (state.answers[state.room].every(Boolean)) { const lz = document.querySelector('.lock-zone'); if (lz) lz.classList.remove('hidden'); }fb.className='feedback correct';fb.textContent='Correct! ✓';input.disabled=true;input.style.borderColor='var(--green)';tone(true)}else{state.answers[state.room][i]=false;fb.className='feedback incorrect';fb.textContent='Not quite — try again';tone(false)}}
  function confirmRoom(){const r=rooms[state.room],dial=document.querySelector('#roomDial'),status=document.querySelector('#dialStatus');if(state.dial[state.room]===r.digit){tone(true);dial.classList.add('flash');status.className='dial-status unlocked';status.textContent='🔓 UNLOCKED!';setTimeout(()=>{state.entered[state.room]=r.digit;if(state.room===4){renderFinal()}else{state.room++;renderRoom()}},1500)}else{tone(false);dial.classList.add('shake');status.className='dial-status incorrect';status.textContent='Incorrect — try again';state.dial[state.room]=0;setTimeout(()=>{dial.classList.remove('shake');const v=document.querySelector('#dialValue');if(v)v.textContent='0'},450)}}
  function renderFinal(){clearInterval(state.interval);app.innerHTML=`<main class="screen"><div class="topbar"><div><div class="brand">Mr. Lee's AP Stats Lab</div><strong>FINAL SECURITY CHECK</strong></div><div class="timer">${formatTime()}</div></div><section class="panel final-screen"><h2>THE VAULT DOOR</h2><p>${rooms[4].theme}</p><div class="vault-summary">${rooms.map((r,i)=>`<div class="mini-dial">Room ${i+1}<strong>${state.entered[i]}</strong></div>`).join('')}</div><div class="vault-stage"><div class="vault-interior">💎 🏆 💰</div><div class="vault-door" id="vaultDoor">🔒</div></div><div id="finalStatus" class="feedback"></div><button class="gold-btn" data-action="crack">CRACK THE VAULT</button></section></main>`}
  function confetti(){const c=document.createElement('div');c.className='confetti';for(let i=0;i<70;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.top=(Math.random()*25-10)+'%';x.style.background=['#FFD600','#fff','#67e8f9','#fb7185','#86efac'][i%5];x.style.animationDelay=(Math.random()*.7)+'s';c.appendChild(x)}document.body.appendChild(c);setTimeout(()=>c.remove(),3000)}
  function crack(){const status=document.querySelector('#finalStatus');if(state.entered.join('')==='67194'){document.querySelector('#vaultDoor').classList.add('open');status.className='feedback correct';status.innerHTML=`🎉 HEIST SUCCESSFUL!<br><small>Time remaining: ${formatTime()}</small>`;tone(true);confetti()}else{status.className='feedback incorrect';status.textContent='Not quite — recheck your room answers';document.querySelector('.vault-stage').classList.add('shake');tone(false);setTimeout(()=>document.querySelector('.vault-stage').classList.remove('shake'),500)}}
  app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='begin'){state.started=true;startTimer();renderRoom()}if(a==='continue'){b.closest('.overlay').remove()}if(a==='solution'){const box=document.querySelector(`#solution-${b.dataset.index}`);box.classList.toggle('hidden');b.textContent=box.classList.contains('hidden')?'Show Worked Solution':'Hide Solution'}if(a==='check-answer')checkAnswer(Number(b.dataset.index));if(a==='dial-up'||a==='dial-down'){const d=state.room;state.dial[d]=(state.dial[d]+(a==='dial-up'?1:9))%10;document.querySelector('#dialValue').textContent=state.dial[d]}if(a==='confirm-room')confirmRoom();if(a==='crack')crack()});
  app.addEventListener('input',e=>{if(e.target.matches('[data-answer]')){const i=Number(e.target.dataset.answer);const fb=document.querySelector(`#feedback-${i}`);if(fb)fb.textContent=''}});app.addEventListener('wheel',e=>{if(e.target.matches('input[type=number]'))e.preventDefault()},{passive:false});renderStart();
});
</script>
</body>
</html>
